<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1080px; height: 1350px; background-color: #000000;
            color: #ffffff; font-family: 'Inter', sans-serif;
            position: relative; overflow: hidden;
        }

        #bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            z-index: 1; display: none;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.98) 10%, rgba(0,0,0,0.7) 40%, rgba(0,0,0,0.1) 100%);
            z-index: 2; display: none;
        }

        .slide-container {
            position: absolute; z-index: 3; width: 100%;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }

        .cover-layout { bottom: 140px; padding: 0 60px; }
        .content-layout { top: 50%; transform: translateY(-50%); padding: 0 90px; }

        .brand-tag {
            font-size: 30px; font-weight: 700; background-color: rgba(0, 0, 0, 0.75);
            padding: 10px 28px; border-radius: 50px; border: 2px solid #00E5FF;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); margin-bottom: 25px;
            display: none;
        }

        .headline {
            font-size: 95px; font-weight: 900; line-height: 1.1; letter-spacing: -2px;
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.95); display: none;
        }

        .story-text {
            font-size: 52px; font-weight: 300; line-height: 1.5; color: #E6E6E6;
            letter-spacing: -0.5px; text-align: left; width: 100%; display: none;
        }

        .cta-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; padding: 0 90px; z-index: 4;
        }

        /* Clean blue theme: no neon, frosted glass effect */
        .cta-box {
            background: rgba(0, 15, 30, 0.5);
            border: 1px solid rgba(0, 140, 255, 0.3);
            border-radius: 20px; padding: 70px 50px;
            text-align: center; width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
        }

        .cta-title { font-size: 56px; font-weight: 900; color: #ffffff; margin-bottom: 20px; letter-spacing: -1px; }
        .cta-sub { font-size: 38px; font-weight: 300; color: #b3d4ff; line-height: 1.4; } /* Soft light blue */

        .swipe-indicator {
            position: absolute; bottom: 60px; left: 0; width: 100%; display: none;
            justify-content: center; align-items: center; gap: 12px;
            font-size: 26px; font-weight: 700; letter-spacing: 3px;
            text-transform: uppercase; color: #00E5FF; z-index: 3;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .footer-handle {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            font-size: 26px; font-weight: 700; color: #888888;
            letter-spacing: 1px; z-index: 3; display: none;
        }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div class="overlay"></div>

    <div class="slide-container" id="slide-container">
        <div class="brand-tag" id="brand-tag">@CodeWithCyril</div>
        <div class="headline" id="title"></div>
        <div class="story-text" id="story-body"></div>
    </div>

    <div class="cta-container" id="cta-block">
        <!-- Re-using the brand pill graphic above the CTA box -->
        <div class="brand-tag" style="display: block; margin-bottom: 40px;">@CodeWithCyril</div>
        <div class="cta-box">
            <div class="cta-title">Enjoyed this update?</div>
            <div class="cta-sub">Follow <strong>@CodeWithCyril</strong> for daily tech drops & AI breakdowns</div>
        </div>
    </div>

    <div class="swipe-indicator" id="swipe-tag">
        <span>SWIPE</span>
        <span class="swipe-arrow">➜</span>
    </div>
    <div class="footer-handle" id="footer-handle">@CodeWithCyril</div>
</body>
</html>
