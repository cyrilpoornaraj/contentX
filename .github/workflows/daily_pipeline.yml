name: Automated Instagram Content Engine

on:
  schedule:
    # Runs 5 times a day at set UTC intervals (e.g., 04:00, 08:00, 12:00, 16:00, 20:00)
    - cron: '0 4,8,12,16,20 * * *'
  workflow_dispatch:
    
jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run News Orchestrator (Generates JSON via Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/orchestrator.js

      - name: Fetch Background Images
        run: node src/fetch_images.js

      - name: Render Carousels & Singles via Puppeteer
        run: |
          node src/render_carousels.js
          node src/render_singles.js

      - name: Publish to Instagram via Graph API
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: node scripts/publish_instagram.mjs

      - name: Upload Generated Posts as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instagram-posts
          path: output/
 

